<section class="techstack" id="tech-stack">

      <div class="container">
        <!-- Section Header -->
        <div class="section-header">
          <span class="section-tag">
            <span class="tag-line"></span>
            05. Tech Stack
          </span>
          <h2 class="section-title">
            Technologies I <span class="title-accent">Work With</span>
          </h2>
          <p class="section-subtitle">
            A curated stack of languages, frameworks, and platforms I use to build
            reliable software across web, mobile, desktop, and the cloud.
          </p>
        </div>

        <!-- Tech Grid -->
        <div class="tech-grid">
          <div
            class="tech-card"
            *ngFor="let category of techCategories; let i = index"
            [class.accent-emerald]="category.accent === 'emerald'"
            [style.animation-delay.ms]="i * 80"
          >
            <div class="card-glow"></div>

            <!-- Card Header -->
            <div class="card-header">
              <div class="card-icon">
                <!-- Web -->
                <svg *ngIf="category.icon === 'web'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                <!-- Cross-platform -->
                <svg *ngIf="category.icon === 'cross'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                  <line x1="8" y1="21" x2="16" y2="21"></line>
                  <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <!-- Backend -->
                <svg *ngIf="category.icon === 'backend'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                  <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                  <line x1="6" y1="6" x2="6.01" y2="6"></line>
                  <line x1="6" y1="18" x2="6.01" y2="18"></line>
                </svg>
                <!-- Database -->
                <svg *ngIf="category.icon === 'database'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                  <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                  <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                </svg>
                <!-- Hosting -->
                <svg *ngIf="category.icon === 'hosting'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
                </svg>
                <!-- Desktop -->
                <svg *ngIf="category.icon === 'desktop'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
                  <line x1="9" y1="6" x2="15" y2="6"></line>
                  <line x1="9" y1="10" x2="15" y2="10"></line>
                  <line x1="9" y1="14" x2="12" y2="14"></line>
                </svg>
              </div>
              <div class="card-titles">
                <h3 class="card-title">{{ category.title }}</h3>
                <p class="card-subtitle">{{ category.subtitle }}</p>
              </div>
            </div>

            <!-- Tech Chips -->
            <div class="tech-chips">
              <div class="tech-chip" *ngFor="let tech of category.techs">
                <span class="chip-dot"></span>
                <div class="chip-content">
                  <span class="chip-name">{{ tech.name }}</span>
                  <span class="chip-desc">{{ tech.description }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
